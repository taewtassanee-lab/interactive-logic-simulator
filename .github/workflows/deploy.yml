name: Deploy to GitHub Pages

# ทุกครั้งที่ push โค้ดขึ้น branch main ระบบจะ build และอัปเดตเว็บให้อัตโนมัติ
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ให้ deploy ทีละงาน ไม่ยกเลิกงานที่กำลังทำอยู่
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ติดตั้ง dependencies
        run: npm ci

      - name: ตรวจสอบคุณภาพโค้ด
        run: npm run lint

      - name: Build เว็บแอป
        run: npm run build

      - name: เตรียมไฟล์สำหรับ GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: เผยแพร่ขึ้น GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
